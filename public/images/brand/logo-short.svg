<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F97316;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c2410c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="shineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.18" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect x="0" y="0" width="200" height="200" rx="40" ry="40" fill="url(#bgGrad)" />
  <!-- Shine overlay -->
  <rect x="0" y="0" width="200" height="100" rx="40" ry="40" fill="url(#shineGrad)" />

  <!-- Decorative outer ring -->
  <rect x="10" y="10" width="180" height="180" rx="32" ry="32" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2" />

  <!-- S letter - large, elegant -->
  <text x="100" y="130"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="120"
    font-weight="700"
    fill="white"
    text-anchor="middle"
    opacity="0.95">S</text>

  <!-- Bottom label -->
  <rect x="30" y="155" width="140" height="26" rx="5" fill="rgba(0,0,0,0.25)" />
  <text x="100" y="173"
    font-family="'Segoe UI', Arial, sans-serif"
    font-size="13"
    font-weight="600"
    fill="white"
    text-anchor="middle"
    letter-spacing="2.5">FASHION</text>
</svg>


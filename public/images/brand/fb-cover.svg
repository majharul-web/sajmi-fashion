<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 312" width="820" height="312">
  <defs>
    <!-- Main background gradient: orange → dark navy -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   style="stop-color:#F97316;stop-opacity:1" />
      <stop offset="45%"  style="stop-color:#c2410c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1" />
    </linearGradient>
    <!-- Overlay shimmer -->
    <linearGradient id="shimmer" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   style="stop-color:#ffffff;stop-opacity:0.07" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0.15" />
    </linearGradient>
    <!-- Soft vignette -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="80%">
      <stop offset="60%" style="stop-color:#000000;stop-opacity:0" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0.35" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="820" height="312" fill="url(#bgGrad)" />
  <rect width="820" height="312" fill="url(#shimmer)" />
  <rect width="820" height="312" fill="url(#vignette)" />

  <!-- === Decorative geometric shapes (right side fabric/fashion feel) === -->
  <!-- Large faded circle -->
  <circle cx="650" cy="156" r="180" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="40" />
  <circle cx="650" cy="156" r="130" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2" />
  <circle cx="650" cy="156" r="90"  fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1.5" />

  <!-- Diagonal accent lines (fabric/weave) -->
  <line x1="480" y1="0"   x2="820" y2="312" stroke="rgba(255,255,255,0.05)" stroke-width="22" />
  <line x1="520" y1="0"   x2="820" y2="260" stroke="rgba(255,255,255,0.04)" stroke-width="10" />
  <line x1="440" y1="0"   x2="820" y2="340" stroke="rgba(255,255,255,0.03)" stroke-width="8" />

  <!-- Clothing hanger icon (right area) -->
  <g transform="translate(660, 80)" opacity="0.18">
    <!-- Hanger hook -->
    <path d="M60,0 Q60,-18 48,-20 Q36,-22 36,-12 Q36,-6 44,-4" fill="none" stroke="white" stroke-width="5" stroke-linecap="round"/>
    <!-- Hanger body -->
    <path d="M44,-4 L0,60 L120,60 Z" fill="none" stroke="white" stroke-width="5" stroke-linejoin="round"/>
    <!-- Hanger shoulder bar -->
    <line x1="0" y1="60" x2="120" y2="60" stroke="white" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Small decorative dots pattern (top right corner) -->
  <g opacity="0.12">
    <circle cx="740" cy="30"  r="3" fill="white"/>
    <circle cx="755" cy="30"  r="3" fill="white"/>
    <circle cx="770" cy="30"  r="3" fill="white"/>
    <circle cx="785" cy="30"  r="3" fill="white"/>
    <circle cx="800" cy="30"  r="3" fill="white"/>
    <circle cx="740" cy="45"  r="3" fill="white"/>
    <circle cx="755" cy="45"  r="3" fill="white"/>
    <circle cx="770" cy="45"  r="3" fill="white"/>
    <circle cx="785" cy="45"  r="3" fill="white"/>
    <circle cx="800" cy="45"  r="3" fill="white"/>
    <circle cx="740" cy="60"  r="3" fill="white"/>
    <circle cx="755" cy="60"  r="3" fill="white"/>
    <circle cx="770" cy="60"  r="3" fill="white"/>
    <circle cx="785" cy="60"  r="3" fill="white"/>
    <circle cx="800" cy="60"  r="3" fill="white"/>
  </g>

  <!-- === LEFT: Logo badge === -->
  <!-- Orange circle badge -->
  <circle cx="90" cy="130" r="52" fill="rgba(255,255,255,0.15)" />
  <circle cx="90" cy="130" r="46" fill="rgba(255,255,255,0.1)" />
  <!-- S letter -->
  <text x="90" y="150"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="58" font-weight="700"
    fill="white" text-anchor="middle" opacity="0.95">S</text>

  <!-- === MAIN Brand Text === -->
  <!-- SajMi — large bold white -->
  <text x="162" y="118"
    font-family="'Segoe UI', Arial, sans-serif"
    font-size="58" font-weight="800"
    fill="white" letter-spacing="1">SajMi</text>

  <!-- FASHION — spaced, orange-tinted -->
  <text x="164" y="158"
    font-family="'Segoe UI', Arial, sans-serif"
    font-size="28" font-weight="300"
    fill="rgba(255,220,180,0.95)" letter-spacing="10">FASHION</text>

  <!-- Thin divider line -->
  <line x1="162" y1="168" x2="460" y2="168" stroke="rgba(255,255,255,0.3)" stroke-width="1" />

  <!-- Bengali tagline -->
  <text x="164" y="192"
    font-family="'Noto Sans Bengali', 'SolaimanLipi', Arial, sans-serif"
    font-size="16" fill="rgba(255,255,255,0.75)" letter-spacing="1">সাজমি ফ্যাশন — সেরা মানের পোশাক</text>

  <!-- English tagline -->
  <text x="164" y="215"
    font-family="'Segoe UI', Arial, sans-serif"
    font-size="13" fill="rgba(255,220,180,0.7)" letter-spacing="2">QUALITY FASHION AT AFFORDABLE PRICE</text>

  <!-- === BOTTOM BAR === -->
  <rect x="0" y="264" width="820" height="48" fill="rgba(0,0,0,0.3)" />

  <!-- Contact info icons row -->
  <!-- WhatsApp label -->
  <circle cx="162" cy="288" r="10" fill="rgba(255,255,255,0.15)" />
  <text x="162" y="293" font-family="Arial" font-size="11" fill="white" text-anchor="middle">W</text>
  <text x="178" y="293" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.8)">01747615357</text>

  <!-- Divider dot -->
  <circle cx="262" cy="288" r="2.5" fill="rgba(255,255,255,0.4)"/>

  <!-- Facebook label -->
  <circle cx="278" cy="288" r="10" fill="rgba(255,255,255,0.15)" />
  <text x="278" y="293" font-family="Arial" font-size="11" fill="white" text-anchor="middle">f</text>
  <text x="294" y="293" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.8)">SajMi Fashion</text>

  <!-- Divider dot -->
  <circle cx="400" cy="288" r="2.5" fill="rgba(255,255,255,0.4)"/>

  <!-- Location -->
  <text x="412" y="293" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.75)">📍 টুপির হাট, নবাবগঞ্জ, দিনাজপুর</text>

  <!-- Right: established year -->
  <text x="790" y="293" font-family="'Segoe UI', Arial, sans-serif" font-size="11"
    fill="rgba(255,255,255,0.4)" text-anchor="end">Est. 2026</text>

  <!-- === TOP decorative bar === -->
  <rect x="0" y="0" width="820" height="4" fill="rgba(255,255,255,0.2)" />
  <rect x="0" y="0" width="140" height="4" fill="rgba(255,255,255,0.6)" />
</svg>

